spring.application.name=task-tracker-email-sender
spring.profiles.active=local

spring.kafka.consumer.group-id=letter_group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=ru.monyamau.task_tracker_email_sender.dto.LetterMessageDto
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

kafka.topic=EMAIL_SENDING_TASKS