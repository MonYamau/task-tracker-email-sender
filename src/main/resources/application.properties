spring.application.name=task-tracker-email-sender
spring.config.import=file:./.env[.properties]
spring.profiles.active=local

spring.kafka.consumer.group-id=letter_group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=ru.monyamau.task_tracker_email_sender.dto.LetterMessageDto
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

kafka.topic=EMAIL_SENDING_TASKS
mail.sender=${MAIL_SENDER}